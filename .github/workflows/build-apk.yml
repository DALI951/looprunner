name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/LoopRunner.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LoopRunner v1.0.${{ github.run_number }}
          body: |
            ## LoopRunner Automated Release 🏃💨
            
            - **Commit**: ${{ github.sha }}
            - **Build**: #${{ github.run_number }}
            - **Features**:
              - Leaflet OpenStreetMap hero map view
              - Real-time visible route polyline (zero backtracking)
              - Loop generator & target distance matching
              - Saved places manager
              - Live stats HUD (duration, distance, pace, max speed, calories)
              - Personal records & progress improvement charts
              - In-app update checker
              
            ### Download APK:
            Download and install **`LoopRunner.apk`** directly on your Android phone.
          files: release-artifacts/LoopRunner.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
